<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300"><rect width="960" height="300" fill="#101827"/><g font-family="sans-serif" fill="#eef5ff"><text x="36" y="42" font-size="24">Controlled layer-weight editing</text><g font-size="17"><rect x="35" y="82" width="200" height="80" rx="10" fill="#26415f"/><text x="55" y="115">Original Pythia-70M</text><text x="55" y="143">preserved baseline</text><text x="250" y="130">→</text><rect x="290" y="82" width="240" height="80" rx="10" fill="#28514e"/><text x="310" y="115">Clone + layer remap</text><text x="310" y="143">strict tensor validation</text><text x="548" y="130">→</text><rect x="590" y="82" width="330" height="80" rx="10" fill="#433e65"/><text x="610" y="115">(1−α) original + α remapped</text><text x="610" y="143">α ∈ {0.01, 0.05, 0.10}</text><text x="38" y="215">256 disjoint calibration questions → freeze choice → 1,838 held-out questions</text><text x="38" y="258" fill="#a5b8ce">Same model size · no gradient training · report gains and regressions</text></g></g></svg>
